<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        .font-title { font-family: 'Cinzel', serif; }
        .font-body { font-family: 'Outfit', sans-serif; }

        /* Spatial Light Theme with Vibrant Soft Gradients */
        body {
            background-color: #f8fafc;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(244, 114, 182, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(129, 140, 248, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(251, 191, 36, 0.1) 0%, #f1f5f9 100%);
            color: #1e293b;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Spatial Light Glassmorphism */
        .glass-spatial {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 40px -15px rgba(148, 163, 184, 0.3);
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(203, 213, 225, 0.8);
        }
        .glass-input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
        }

        /* Curtain Opening Animation Logic */
        #curtain-container {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            pointer-events: auto;
            transition: visibility 0.8s ease;
        }

        .curtain-panel {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50%;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
            z-index: 2;
        }

        #curtain-left { left: 0; transform-origin: left; }
        #curtain-right { right: 0; transform-origin: right; }

        .open-left { transform: translateX(-100%); }
        .open-right { transform: translateX(100%); }

        /* Curtain Center Content (Entrance Card) */
        #entrance-content {
            position: relative;
            z-index: 10;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        /* Phoenix Glow */
        @keyframes phoenixPulse {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(245, 158, 11, 0.7)); }
            50% { filter: drop-shadow(0 0 30px rgba(239, 68, 68, 0.9)); }
        }
        .phoenix-glow { animation: phoenixPulse 3s ease-in-out infinite; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>

              { id: "ll_9", title: "Sort List", difficulty: "Medium", link: "https://leetcode.com/problems/sort-list/" },
              { id: "ll_10", title: "Reverse Nodes in k-Group", difficulty: "Hard", link: "https://leetcode.com/problems/reverse-nodes-in-k-group/" },
              { id: "ll_11", title: "Merge k Sorted Lists", difficulty: "Hard", link: "https://leetcode.com/problems/merge-k-sorted-lists/" },
              { id: "ll_12", title: "Palindrome Linked List", difficulty: "Easy", link: "https://leetcode.com/problems/palindrome-linked-list/" }
            ]
          },
          {
            folderName: "12-stacks-queues",
            title: "Stacks & Queues",
            questions: [
              { id: "stk_1", title: "Valid Parentheses", difficulty: "Easy", link: "https://leetcode.com/problems/valid-parentheses/" },
              { id: "stk_2", title: "Implement Queue using Stacks", difficulty: "Easy", link: "https://leetcode.com/problems/implement-queue-using-stacks/" },
              { id: "stk_3", title: "Min Stack", difficulty: "Medium", link: "https://leetcode.com/problems/min-stack/" },
              { id: "stk_4", title: "Next Greater Element I", difficulty: "Easy", link: "https://leetcode.com/problems/next-greater-element-i/" },
              { id: "stk_5", title: "Evaluate Reverse Polish Notation", difficulty: "Medium", link: "https://leetcode.com/problems/evaluate-reverse-polish-notation/" },
              { id: "stk_6", title: "Largest Rectangle in Histogram", difficulty: "Hard", link: "https://leetcode.com/problems/largest-rectangle-in-histogram/" },
              { id: "stk_7", title: "Implement Stack using Queues", difficulty: "Easy", link: "https://leetcode.com/problems/implement-stack-using-queues/" }
            ]
          },
          {
            folderName: "13-trees",
            title: "Binary Trees & BST",
            questions: [
              { id: "tree_1", title: "Binary Tree Inorder Traversal", difficulty: "Easy", link: "https://leetcode.com/problems/binary-tree-inorder-traversal/" },
              { id: "tree_2", title: "Same Tree", difficulty: "Easy", link: "https://leetcode.com/problems/same-tree/" },
              { id: "tree_3", title: "Symmetric Tree", difficulty: "Easy", link: "https://leetcode.com/problems/symmetric-tree/" },
              { id: "tree_4", title: "Maximum Depth of Binary Tree", difficulty: "Easy", link: "https://leetcode.com/problems/maximum-depth-of-binary-tree/" },
              { id: "tree_5", title: "Invert Binary Tree", difficulty: "Easy", link: "https://leetcode.com/problems/invert-binary-tree/" },
              { id: "tree_6", title: "Validate Binary Search Tree", difficulty: "Medium", link: "https://leetcode.com/problems/validate-binary-search-tree/" },
              { id: "tree_7", title: "Binary Tree Level Order Traversal", difficulty: "Medium", link: "https://leetcode.com/problems/binary-tree-level-order-traversal/" },
              { id: "tree_8", title: "Path Sum II", difficulty: "Medium", link: "https://leetcode.com/problems/path-sum-ii/" },
              { id: "tree_9", title: "Binary Tree Maximum Path Sum", difficulty: "Hard", link: "https://leetcode.com/problems/binary-tree-maximum-path-sum/" },
              { id: "tree_10", title: "Serialize and Deserialize Binary Tree", difficulty: "Hard", link: "https://leetcode.com/problems/serialize-and-deserialize-binary-tree/" },
              { id: "tree_11", title: "Binary Tree Preorder Traversal", difficulty: "Easy", link: "https://leetcode.com/problems/binary-tree-preorder-traversal/" },
              { id: "tree_12", title: "Binary Tree Postorder Traversal", difficulty: "Easy", link: "https://leetcode.com/problems/binary-tree-postorder-traversal/" }
            ]
          },
          {
            folderName: "14-heaps",
            title: "Heaps / Priority Queue",
            questions: [
              { id: "heap_1", title: "Kth Largest Element in an Array", difficulty: "Medium", link: "https://leetcode.com/problems/kth-largest-element-in-an-array/" },
              { id: "heap_2", title: "Last Stone Weight", difficulty: "Easy", link: "https://leetcode.com/problems/last-stone-weight/" },
              { id: "heap_3", title: "Top K Frequent Elements", difficulty: "Medium", link: "https://leetcode.com/problems/top-k-frequent-elements/" },
              { id: "heap_4", title: "Find Median from Data Stream", difficulty: "Hard", link: "https://leetcode.com/problems/find-median-from-data-stream/" },
              { id: "heap_5", title: "K Closest Points to Origin", difficulty: "Medium", link: "https://leetcode.com/problems/k-closest-points-to-origin/" }
            ]
          },
          {
            folderName: "15-graphs",
            title: "Graphs",
            questions: [
              { id: "graph_1", title: "Find if Path Exists in Graph", difficulty: "Easy", link: "https://leetcode.com/problems/find-if-path-exists-in-graph/" },
              { id: "graph_2", title: "Course Schedule", difficulty: "Medium", link: "https://leetcode.com/problems/course-schedule/" },
              { id: "graph_3", title: "Number of Islands", difficulty: "Medium", link: "https://leetcode.com/problems/number-of-islands/" },
              { id: "graph_4", title: "Rotting Oranges", difficulty: "Medium", link: "https://leetcode.com/problems/rotting-oranges/" },
              { id: "graph_5", title: "Word Ladder", difficulty: "Hard", link: "https://leetcode.com/problems/word-ladder/" },
              { id: "graph_6", title: "Clone Graph", difficulty: "Medium", link: "https://leetcode.com/problems/clone-graph/" },
              { id: "graph_7", title: "Course Schedule II", difficulty: "Medium", link: "https://leetcode.com/problems/course-schedule-ii/" }
            ]
          }
        ];

        let solvedQuestions = JSON.parse(localStorage.getItem('hogwarts_spatial_solved')) || [];

        const container = document.getElementById('tracker-container');
        const progressBar = document.getElementById('progress-bar');
        const progressPercentage = document.getElementById('progress-percentage');
        const solvedCountSpan = document.getElementById('solved-count');
        const totalCountSpan = document.getElementById('total-count');
        const searchInput = document.getElementById('search-input');
        const resetBtn = document.getElementById('reset-btn');

        function getTotalQuestionsCount() {
            let count = 0;
            dsaData.forEach(folder => count += folder.questions.length);
            return count;
        }

        function updateStats() {
            const total = getTotalQuestionsCount();
            const solved = solvedQuestions.length;
            const percentage = total > 0 ? Math.round((solved / total) * 100) : 0;

            progressBar.style.width = `${percentage}%`;
            progressPercentage.innerText = `${percentage}%`;
            solvedCountSpan.innerText = solved;
            totalCountSpan.innerText = total;
        }

        function getDifficultyBadgeClass(difficulty) {
            switch (difficulty) {
                case 'Easy': return 'bg-emerald-50 text-emerald-700 border-emerald-200';
                case 'Medium': return 'bg-amber-50 text-amber-700 border-amber-200';
                case 'Hard': return 'bg-rose-50 text-rose-700 border-rose-200';
                default: return 'bg-slate-100 text-slate-700 border-slate-200';
            }
        }

        function renderTracker(filterText = '') {
            container.innerHTML = '';
            const query = filterText.toLowerCase().trim();

            let hasResults = false;

            dsaData.forEach((folder) => {
                const filteredQuestions = folder.questions.filter(q => 
                    q.title.toLowerCase().includes(query) || 
                    folder.title.toLowerCase().includes(query) ||
                    q.difficulty.toLowerCase().includes(query)
                );

                if (filteredQuestions.length === 0) return;
                hasResults = true;

                const folderCard = document.createElement('div');
                folderCard.className = 'glass-spatial rounded-2xl overflow-hidden transition duration-300';

                const headerBtn = document.createElement('div');
                headerBtn.className = 'w-full px-5 py-4 bg-white/60 hover:bg-white/90 flex items-center justify-between cursor-pointer transition select-none';
                
                const folderSolved = folder.questions.filter(q => solvedQuestions.includes(q.id)).length;
                
                headerBtn.innerHTML = `
                    <div class="flex items-center gap-3.5">
                        <span class="text-indigo-600 text-base">📜</span>
                        <div>
                            <h2 class="text-base font-bold font-title text-indigo-950">${folder.title}</h2>
                            <span class="text-[11px] text-slate-400 font-mono">Vault: ${folder.folderName}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="text-xs font-semibold px-3 py-1 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-100">
                            ${folderSolved} / ${folder.questions.length} Mastered
                        </span>
                        <span class="text-slate-400 text-xs transform transition-transform duration-200">▼</span>
                    </div>
                `;

                const listContainer = document.createElement('div');
                listContainer.className = 'border-t border-slate-100 divide-y divide-slate-100 bg-white/30';

                filteredQuestions.forEach(q => {
                    const isChecked = solvedQuestions.includes(q.id);

                    const row = document.createElement('div');
                    row.className = 'px-5 py-3.5 flex items-center justify-between hover:bg-white/60 transition gap-4';

                    const leftDiv = document.createElement('div');
                    leftDiv.className = 'flex items-center gap-3.5 flex-1 min-w-0';

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.checked = isChecked;
                    checkbox.className = 'w-4 h-4 rounded accent-indigo-600 cursor-pointer shrink-0 border-slate-300';

                    const titleContainer = document.createElement('div');
                    titleContainer.className = 'flex items-center gap-2.5 min-w-0 flex-wrap';

                    const titleLink = document.createElement('a');
                    titleLink.href = q.link;
                    titleLink.target = '_blank';
                    titleLink.innerText = q.title;
                    titleLink.className = `text-sm transition font-medium ${isChecked ? 'line-through text-slate-400' : 'text-slate-700 hover:text-indigo-600'}`;

                    const diffBadge = document.createElement('span');
                    diffBadge.innerText = q.difficulty;
                    diffBadge.className = `text-[10px] px-2 py-0.5 rounded border font-semibold uppercase tracking-wider ${getDifficultyBadgeClass(q.difficulty)}`;

                    checkbox.addEventListener('change', () => {
                        if (checkbox.checked) {
                            if (!solvedQuestions.includes(q.id)) solvedQuestions.push(q.id);
                            titleLink.classList.add('line-through', 'text-slate-400');
                            titleLink.classList.remove('text-slate-700', 'hover:text-indigo-600');
                        } else {
                            solvedQuestions = solvedQuestions.filter(id => id !== q.id);
                            titleLink.classList.remove('line-through', 'text-slate-400');
                            titleLink.classList.add('text-slate-700', 'hover:text-indigo-600');
                        }
                        localStorage.setItem('hogwarts_spatial_solved', JSON.stringify(solvedQuestions));
                        updateStats();
                        updateFolderBadge(folderCard, folder);
                    });

                    titleContainer.appendChild(titleLink);
                    titleContainer.appendChild(diffBadge);
                    leftDiv.appendChild(checkbox);
                    leftDiv.appendChild(titleContainer);
                    row.appendChild(leftDiv);

                    const leetCodeLink = document.createElement('a');
                    leetCodeLink.href = q.link;
                    leetCodeLink.target = '_blank';
                    leetCodeLink.innerHTML = 'Cast Spell ↗';
                    leetCodeLink.className = 'text-[11px] font-semibold bg-indigo-50 hover:bg-indigo-600 hover:text-white text-indigo-700 border border-indigo-100 px-3 py-1 rounded-md transition shrink-0 shadow-sm';
                    row.appendChild(leetCodeLink);

                    listContainer.appendChild(row);
                });

                let isOpen = true;
                headerBtn.addEventListener('click', () => {
                    isOpen = !isOpen;
                    listContainer.style.display = isOpen ? 'block' : 'none';
                    headerBtn.querySelector('.transform').style.transform = isOpen ? 'rotate(0deg)' : 'rotate(-90deg)';
                });

                folderCard.appendChild(headerBtn);
                folderCard.appendChild(listContainer);
                container.appendChild(folderCard);
            });

            if (!hasResults) {
                container.innerHTML = `
                    <div class="glass-spatial text-center py-12 text-slate-500 rounded-2xl font-medium shadow-sm">
                        Mischief Managed! No matching spells or vaults found.
                    </div>
                `;
            }

            updateStats();
        }

        function updateFolderBadge(folderCard, folder) {
            const folderSolved = folder.questions.filter(q => solvedQuestions.includes(q.id)).length;
            const badge = folderCard.querySelector('span.rounded-full');
            if(badge) {
                badge.innerText = `${folderSolved} / ${folder.questions.length} Mastered`;
            }
        }

        searchInput.addEventListener('input', (e) => {
            renderTracker(e.target.value);
        });

        resetBtn.addEventListener('click', () => {
            if (confirm("Are you sure you wish to cast Obliviate and clear all your memory of mastered spells?")) {
                solvedQuestions = [];
                localStorage.removeItem('hogwarts_spatial_solved');
                renderTracker(searchInput.value);
            }
        });

        renderTracker();
    </script>
</body>
</html>
